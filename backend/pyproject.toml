[project]
name = "lifehub-backend"
version = "0.1.0"
description = "LifeHub backend — local-first habit telemetry (vertical slice)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    # FastAPI usa Depends()/Query() como default de argumento por design
    # (padrão idiomático do framework, não um defeito de código).
    "B008",
    # App local-first: "hoje" é o dia LOCAL do usuário (não UTC). date.today()
    # é semanticamente correto aqui; forçar UTC mudaria o dia do tracker.
    "DTZ",
]